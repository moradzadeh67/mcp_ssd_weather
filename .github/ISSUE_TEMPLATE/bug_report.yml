name: Bug report
description: Report something that is not working as expected
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this. Please fill in as much as you can.

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      description: Where did you see the problem?
      options:
        - Android
        - iOS
        - macOS
        - Web
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: App version
      description: The release you downloaded, or the version shown in the app settings.
      placeholder: "1.0.1"
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect to happen, and what happened instead?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the app
        2. Tap on '...'
        3. See the error
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Paste any relevant output from `flutter run` here.
      render: shell
    validations:
      required: false
